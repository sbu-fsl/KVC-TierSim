# Raw data sources, fetched into datasets/data/raw/ by `make fetch`
# (python datasets/scripts/fetch.py). Workloads point at these keys with
# `source:` in catalog/workloads.yaml.
#
# kinds
#   hf_zip      one archive in a Hugging Face dataset repo; `members` maps archive path -> raw path
#   hf_file     files in a Hugging Face dataset repo; `files` maps repo path -> raw path
#   hf_dataset  a Hugging Face dataset loaded with `datasets` and normalized by
#               kvwl/hf_sources.py:<normalizer> into raw/hf/<workload>.jsonl
#               (needs `pip install datasets`; gated sets need HF_TOKEN)
#   url         plain files; `files` maps URL -> raw path
#   github_dir  files in a GitHub directory (`dirs` maps repo dir -> raw dir; `match` filters names)
#
# `{task}` in a path expands over `tasks`. The non-HF entries are the exact files the
# shipped streams were built from (most are copies vendored in KV-cache paper artifacts);
# they are pinned to the default branch (HEAD) of each repository.

# ------------------------------------------------------------------ Hugging Face
longbench:
  kind: hf_zip
  repo: zai-org/LongBench
  file: data.zip
  tasks: [narrativeqa, qasper, multifieldqa_en, hotpotqa, 2wikimqa, musique, gov_report, qmsum, multi_news,
          trec, triviaqa, samsum, passage_count, passage_retrieval_en, lcc, repobench-p]
  members: {"data/{task}.jsonl": "longbench/{task}.jsonl"}
longbench_config:
  kind: url
  files:
    https://raw.githubusercontent.com/THUDM/LongBench/HEAD/LongBench/config/dataset2prompt.json: longbench/dataset2prompt.json
    https://raw.githubusercontent.com/THUDM/LongBench/HEAD/LongBench/config/dataset2maxlen.json: longbench/dataset2maxlen.json
leval:
  kind: hf_file
  repo: L4NLP/LEval
  tasks_exam: [quality, coursera, gsm100, topic_retrieval_longchat, tpo, codeU]
  tasks_gen: [narrative_qa, paper_assistant, meeting_summ, financial_qa, legal_contract_qa, gov_report_summ]
  files:
    "LEval/Exam/{tasks_exam}.jsonl": "leval/{tasks_exam}.jsonl"
    "LEval/Generation/{tasks_gen}.jsonl": "leval/{tasks_gen}.jsonl"
hf_sharegpt:      {kind: hf_dataset, normalizer: sharegpt, repo: anon8231489123/ShareGPT_Vicuna_unfiltered}
hf_lmsys:         {kind: hf_dataset, normalizer: lmsys, repo: lmsys/lmsys-chat-1m, gated: true}
hf_infinitebench: {kind: hf_dataset, normalizer: infinitebench, repo: xinrongzhang2022/InfiniteBench}
hf_longbench_v2:  {kind: hf_dataset, normalizer: longbench_v2, repo: zai-org/LongBench-v2}
hf_booksum:       {kind: hf_dataset, normalizer: booksum, repo: kmfoda/booksum}
hf_scbench:       {kind: hf_dataset, normalizer: scbench, repo: microsoft/SCBench}
hf_loogle:        {kind: hf_dataset, normalizer: loogle, repo: bigai-nlco/LooGLE}
hf_swebench:      {kind: hf_dataset, normalizer: swebench_agent, repo: nebius/SWE-agent-trajectories}
hf_gpqa:          {kind: hf_dataset, normalizer: gpqa, repo: Idavidrein/gpqa, gated: true}
hf_hellaswag:     {kind: hf_dataset, normalizer: hellaswag, repo: Rowan/hellaswag}
hf_winogrande:    {kind: hf_dataset, normalizer: winogrande, repo: allenai/winogrande}
hf_arc:           {kind: hf_dataset, normalizer: arc, repo: allenai/ai2_arc}
hf_boolq:         {kind: hf_dataset, normalizer: boolq, repo: google/boolq}
hf_copa:          {kind: hf_dataset, normalizer: copa, repo: pkavumba/balanced-copa}

# ------------------------------------------------------------------ GitHub / web
ruler:
  kind: github_dir
  repo: dongwonjo/FastKV            # vendors RULER generated with NVIDIA/RULER
  dirs: {data/RULER/8192: ruler/8192, data/RULER/16384: ruler/16384}
  match: '\.jsonl$'
bbh:
  kind: github_dir
