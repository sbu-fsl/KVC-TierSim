# EVALUATION section, extracted from the full text (arXiv PDF/HTML or the
# venue PDF) on 2026-11-01. `technique` tags the KV-cache technique family the
# paper targets: prefix (prefix caching/eviction), tier (offload/restore/
# prefetch), compress (quantization/eviction/sparsity), nonprefix (RAG chunk
# reuse), sched (scheduling/disaggregation that manages KV), mem (KV memory
